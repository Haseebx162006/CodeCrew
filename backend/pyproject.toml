[project]
name = "backend"
version = "0.1.0"
description = "Autonomous Multi-Agent Software House Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "argon2-cffi>=23.1.0",
    "bcrypt>=4.0.0",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "gitpython>=3.1.59",
    "httpx>=0.28.1",
    "langchain>=1.3.16",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "langgraph-checkpoint>=2.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "passlib[argon2,bcrypt]>=1.7.4",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.35",
    "uvicorn>=0.52.4",
    "langsmith>=0.11.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
