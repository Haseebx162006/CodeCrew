name: Lint and Code Formatting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:

  backend-lint:
    name: Backend Lint & Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linting & Formatting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check Python Code Formatting
        run: ruff format --check .

      - name: Run Ruff Linter
        run: ruff check .

  frontend-lint:
    name: Frontend Lint, Typecheck & Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Build / Typecheck
        run: npm run build

      - name: Check Formatting with Prettier
        run: npx prettier --check "src/**/*.{ts,tsx,css,json}"
