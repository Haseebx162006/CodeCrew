name: Lint and Code Formatting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # -------------------------------------------------------------
  # Backend: Python Formatting & Linting Check
  # -------------------------------------------------------------
  backend-lint:
    name: Backend Lint & Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linting & Formatting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check Python Code Formatting
        run: |
          echo "Checking Python formatting with Ruff..."
          ruff format --diff . || echo "::warning::Python formatting differences detected. Run 'ruff format .' to resolve."

      - name: Run Ruff Linter
        run: |
          echo "Running Ruff linter..."
          ruff check . || echo "::warning::Ruff found lint issues. Run 'ruff check --fix .' to resolve."

  # -------------------------------------------------------------
  # Frontend: TypeScript, React, and Config Formatting Check
  # -------------------------------------------------------------
  frontend-lint:
    name: Frontend Lint, Typecheck & Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run TypeScript Build / Typecheck
        run: npm run build

      - name: Check Formatting with Prettier
        run: |
          npx --yes prettier --check "src/**/*.{ts,tsx,css,json}" || echo "::warning::Prettier found unformatted frontend files. Run 'npm run format' to fix."
